<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Katalog wrapp.co</title>
  <meta name="description" content="Katalog kebutuhan operasional F&amp;B dari wrapp.co: trashbag, tisu, sabun, dan lainnya.">

  <!-- Cadangan jika JavaScript dimatikan: alihkan setelah 1 detik -->
  <meta http-equiv="refresh" content="1; url=wrapp.co.pdf">

  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #0b5cff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #f2f2f2;
        --muted: #a8a8a8;
        --accent: #6ea2ff;
      }
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 22rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
    a.button {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a.button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>

  <script>
    // Alihkan langsung tanpa menambah riwayat, supaya tombol Kembali tidak memutar
    window.location.replace("wrapp.co.pdf");
  </script>
</head>
<body>
  <main>
    <h1>Membuka katalog wrapp.co…</h1>
    <p>Jika katalog tidak terbuka otomatis, ketuk tombol di bawah.</p>
    <a class="button" href="wrapp.co.pdf">Buka katalog</a>
  </main>
</body>
</html>
